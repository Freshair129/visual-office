<!doctype html><html lang="th"><meta charset="utf-8"><title>Synthetic integration controls</title><body><h1>SYNTHETIC ONLY · no live upstream</h1><p>ใช้คู่กับแอปหลักบน origin นี้เท่านั้น</p><label>Scenario <select id="scenario"><option>READY</option><option>EMPTY</option><option>PARTIAL</option><option>UNKNOWN</option><option>UNAVAILABLE</option><option>ERROR</option><option>FORBIDDEN</option><option>AUTH_REQUIRED</option><option>HOLD</option></select></label><label>Scene fault <select id="scene-fault"><option>NONE</option><option>GLB404</option><option>BADHASH</option></select></label><fieldset id="context-controls" hidden><legend>Candidate dynamic context</legend><label>Candidate context <select id="context-case"><option>AUTO</option></select></label><label><input type="checkbox" id="context-hold">Hold context</label></fieldset><button id="release">Release held replies</button><button id="expire">Expire synthetic session</button><button id="reset">Reset synthetic session</button><button id="read">Read audit</button><pre id="audit" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre><script type="module">
const audit=document.querySelector('#audit');async function read(){const r=await fetch('/__fixture/log');if(!r.ok)throw Error('Synthetic server required');audit.textContent=JSON.stringify(await r.json(),null,2);}async function control(body){const r=await fetch('/__fixture/control',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw Error('Rejected');await read();}document.querySelector('#scene-fault').onchange=e=>control({sceneFault:e.target.value});document.querySelector('#scenario').onchange=e=>control({scenario:e.target.value});for(const id of ['release','expire','reset'])document.querySelector('#'+id).onclick=()=>control({action:id});document.querySelector('#read').onclick=read;await read();const context=await (await fetch('/__fixture/context-cases')).json();if(context.dynamicMode){document.querySelector('#context-controls').hidden=false;const select=document.querySelector('#context-case');for(const v of context.vectors){const option=document.createElement('option');option.value=v.id;option.textContent=v.id+' · '+v.origin;select.append(option);}select.value=context.contextCase;select.onchange=()=>control({contextCase:select.value});document.querySelector('#context-hold').onchange=e=>control({contextHold:e.target.checked});}
</script></body></html>
